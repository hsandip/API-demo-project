services:
  - type: web
    name: vite-project-staging-api
    runtime: node
    plan: free
    branch: main
    buildCommand: pnpm install --frozen-lockfile && pnpm run server:build
    startCommand: pnpm run server:start
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
